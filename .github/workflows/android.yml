name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        run: ./gradlew :core:test

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LMS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LMS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::LMS_KEYSTORE_BASE64 is not set: release APK uses a temporary debug key and is not published."
          fi

      - name: Build APK
        env:
          LMS_KEYSTORE_PASSWORD: ${{ secrets.LMS_KEYSTORE_PASSWORD }}
          LMS_KEY_ALIAS: ${{ secrets.LMS_KEY_ALIAS }}
          LMS_KEY_PASSWORD: ${{ secrets.LMS_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease -PversionCode=$VERSION_CODE

      - uses: actions/upload-artifact@v4
        with:
          name: lms-android-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Every build of main becomes a release; the stable asset name gives a permanent
      # "latest" link: /releases/latest/download/lms-android.apk
      - name: Publish release
        # Only builds signed with the permanent key are published: others could not update the app.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.LMS_KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="0.1.$VERSION_CODE"
          cp app/build/outputs/apk/release/app-release.apk lms-android.apk
          cp app/build/outputs/apk/release/app-release.apk "lms-android-$version.apk"
          notes="Сборка $version из ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
          gh release create "v$version" lms-android.apk "lms-android-$version.apk" \
            --title "LMS Android $version" --notes "$notes" --target "$GITHUB_SHA" --latest
